<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="todo.css">
</head>
<body>
  <div class="container">
    <h2>Todo List</h2>
    
    <div class="form">
      <input type="text" id="taskName" placeholder="Enter task name">
      
      <select id="priority">
        <option value="Medium">Medium</option>
        <option value="High">High</option>
        <option value="Low">Low</option>
      </select>

      <input type="date" id="startDate">
      <input type="date" id="dueDate">
    </div>

    <button onclick="addTask()">Add</button>

    <table id="taskTable">
      <thead>
        <tr>
          <th>Task Name</th>
          <th>Start Date</th>
          <th>Due Date</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Tasks will appear here -->
      </tbody>
    </table>
  </div>

  <script>
    function addTask() {
      let taskName = document.getElementById("taskName").value;
      let priority = document.getElementById("priority").value;
      let startDate = document.getElementById("startDate").value;
      let dueDate = document.getElementById("dueDate").value;

      if (taskName === "" || startDate === "" || dueDate === "") {
        alert("Please fill all fields");
        return;
      }

      let table = document.getElementById("taskTable").getElementsByTagName("tbody")[0];
      let newRow = table.insertRow();

      newRow.insertCell(0).innerText = taskName;
      newRow.insertCell(1).innerText = startDate;
      newRow.insertCell(2).innerText = dueDate;

      // Priority style
      let priorityCell = newRow.insertCell(3);
      if (priority === "High") {
        priorityCell.innerHTML = `<span class="priority-high">High</span>`;
      } else if (priority === "Medium") {
        priorityCell.innerHTML = `<span class="priority-medium">Medium</span>`;
      } else {
        priorityCell.innerHTML = `<span class="priority-low">Low</span>`;
      }

      // Status
      newRow.insertCell(4).innerHTML = `<span class="status">In Progress</span>`;

      // Actions
      let actionsCell = newRow.insertCell(5);
      actionsCell.innerHTML = `
        <button class="action-btn edit-btn" onclick="editTask(this)">Edit</button>
        <button class="action-btn delete-btn" onclick="deleteTask(this)">Delete</button>
      `;

      // Clear input fields
      document.getElementById("taskName").value = "";
      document.getElementById("startDate").value = "";
      document.getElementById("dueDate").value = "";
    }

    function deleteTask(button) {
      let row = button.parentElement.parentElement;
      row.remove();
    }

    function editTask(button) {
      let row = button.parentElement.parentElement;
      document.getElementById("taskName").value = row.cells[0].innerText;
      document.getElementById("startDate").value = row.cells[1].innerText;
      document.getElementById("dueDate").value = row.cells[2].innerText;
      document.getElementById("priority").value = row.cells[3].innerText;
      row.remove();
    }
  </script>
</body>
</html>
